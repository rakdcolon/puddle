<style>
  :root {
    --bg: #f5ecdb;
    --paper: #fcf7ea;
    --ink: #3a2f22;
    --ink-muted: #a59581;
    --hair: #ebe0c9;
    --accent: #b85a3e;
    --serif: "Crimson Pro", "Iowan Old Style", Georgia, serif;
    --ease: cubic-bezier(.22,.99,.32,1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow: hidden;
  }
  ::selection { background: var(--accent); color: var(--paper); }

  /* Mount target — fills viewport. PuzzleApp paints its own cream bg and
     supplies its own masthead (the wordmark there links back to landing). */
  #root {
    width: 100vw;
    height: 100vh;
  }
</style>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="themes.jsx"></script>
<script type="text/babel" src="puzzle-app.jsx"></script>

<script type="text/babel" data-presets="react">
  // Standalone puzzle page — PuzzleApp wants explicit width/height. Wrap it
  // in a tiny responsive shell so the layout reflows on resize.
  function PuzzlePage() {
    const [size, setSize] = React.useState({
      w: window.innerWidth,
      h: window.innerHeight,
      compact: window.innerWidth < 720,
    });
    React.useEffect(() => {
      const onResize = () => setSize({
        w: window.innerWidth,
        h: window.innerHeight,
        compact: window.innerWidth < 720,
      });
      window.addEventListener('resize', onResize);
      return () => window.removeEventListener('resize', onResize);
    }, []);

    // Today's puzzle is the bridge (PUZZLES[0]). One puzzle a day; the tab
    // strip is auto-hidden when puzzles.length === 1.
    const todaysPuzzles = React.useMemo(() => [PUZZLES[0]], []);
    const issue = { vol: 'III', no: 147 };

    return <PuzzleApp theme={EDITORIAL} width={size.w} height={size.h}
      homeHref="Landing.html"
      puzzles={todaysPuzzles}
      issue={issue}
      solutionHref="Solution.html"
      compact={size.compact} />;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PuzzlePage />);
</script>

</body>
