name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:agent
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/
          retention-days: 14

  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Start disposable Supabase without cloud credentials
        run: npx supabase start --exclude studio,postgres-meta,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - run: npm run db:env
      - run: npm run check:env
      - run: npm run test:live
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14
      - name: Stop disposable database
        if: always()
        run: npx supabase stop

  quality-gate:
    if: always()
    needs: [fast-tests, full-stack]
    runs-on: ubuntu-latest
    steps:
      - name: Require every pyramid layer
        env:
          FAST: ${{ needs.fast-tests.result }}
          FULL: ${{ needs.full-stack.result }}
        run: test "$FAST" = success && test "$FULL" = success
