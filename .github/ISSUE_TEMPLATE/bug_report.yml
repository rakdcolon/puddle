name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections
        below so we can reproduce and fix it quickly.

        ⚠️ **Do not report security vulnerabilities here.** See [SECURITY.md](../../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I do X, Y happens — but I expected Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - solvepuddle.com (web)
        - Discord Activity (embedded)
        - Discord bot (slash command)
        - Local development
        - Other / not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device & browser
      description: e.g. iPhone 15 / Safari, Windows 11 / Chrome 120
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything else that helps — screenshots, console output, etc.
    validations:
      required: false
