<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign in — puddle</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- ━ favicon + social ━ -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.svg" />
  <meta name="theme-color" content="#f5ecdb" />
  <meta name="description" content="Sign in to the column. One click with Google — no passwords." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="puddle" />
  <meta property="og:title" content="Sign in · puddle" />
  <meta property="og:description" content="Sign in to the column. One click with Google — no passwords." />
  <meta property="og:image" content="og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sign in · puddle" />
  <meta name="twitter:description" content="Sign in to the column. One click with Google — no passwords." />
  <meta name="twitter:image" content="og-default.png" />
  <!-- /social -->

<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #f5ecdb;
    --paper: #fcf7ea;
    --paper-deep: #efe5cf;
    --ink: #3a2f22;
    --ink-muted: #a59581;
    --ink-soft: #6e5d48;
    --hair: #ebe0c9;
    --hair-strong: #d9caa6;
    --accent: #b85a3e;
    --success: #6b8a52;
    --shadow: 0 1px 2px rgba(58,47,34,.04), 0 6px 24px rgba(58,47,34,.05);
    --shadow-card: 0 1px 2px rgba(58,47,34,.05), 0 10px 36px rgba(58,47,34,.08);
    --serif: "Crimson Pro", "Iowan Old Style", Georgia, serif;
    --ease: cubic-bezier(.22,.99,.32,1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-feature-settings: "ss01", "cv02";
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: var(--paper); }

  .page {
    min-height: 100vh;
    display: flex; flex-direction: column;
    padding: 28px 56px 24px;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ━━━ masthead — shared chrome ━━━ */
  .masthead {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--hair);
  }
  .masthead-left {
    font-size: 13.5px;
    font-style: italic;
    color: var(--ink-muted);
    letter-spacing: 0.1px;
  }
  .masthead-left .dot { color: var(--accent); padding: 0 6px; }
  .logo {
    display: flex; align-items: center; gap: 10px;
    justify-content: center;
    text-decoration: none; color: inherit;
  }
  .logo-mark {
    width: 26px; height: 26px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-mark i {
    display: block;
    background: var(--ink);
  }
  .logo-mark i:nth-child(2),
  .logo-mark i:nth-child(3) {
    background: var(--accent);
  }
  .logo-text {
    font-size: 26px; font-weight: 500; letter-spacing: -0.4px;
    line-height: 1; color: var(--ink);
  }
  .logo-text .pip { color: var(--accent); padding: 0 2px; }
  .masthead-right {
    font-size: 13.5px;
    color: var(--ink-muted);
    text-align: right;
    letter-spacing: 0.1px;
  }
  .masthead-right a {
    color: var(--ink);
    text-decoration: none;
    margin-left: 22px;
    position: relative;
    transition: color .18s var(--ease);
  }
  .masthead-right a.current {
    color: var(--accent);
    font-style: italic;
  }
  .masthead-right a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -3px;
    height: 1px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform .25s var(--ease);
  }
  .masthead-right a.current::after { transform: scaleX(1); }
  .masthead-right a:hover { color: var(--accent); }
  .masthead-right a:hover::after { transform: scaleX(1); }
  .rule-thin { height: 1px; background: var(--hair); margin-top: 3px; }

  /* ━━━ main — centered hero + button ━━━ */
  .main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 0;
  }

  .stage {
    max-width: 460px;
    width: 100%;
    text-align: center;
  }

  .kicker {
    font-size: 14px;
    font-style: italic;
    color: var(--accent);
    margin: 0 0 18px;
    font-weight: 500;
    letter-spacing: 0.2px;
    display: inline-flex; align-items: center; gap: 12px;
  }
  .kicker::before,
  .kicker::after {
    content: ""; display: inline-block;
    width: 22px; height: 1px; background: var(--accent);
    opacity: 0.6;
  }

  .title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 60px;
    line-height: 1.0;
    letter-spacing: -1.2px;
    margin: 0 0 40px;
    color: var(--ink);
    text-wrap: balance;
  }
  .title em {
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
  }
  .title .ink-accent { color: var(--accent); font-style: italic; }

  .sub {
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 auto 40px;
    max-width: 36ch;
    text-wrap: balance;
  }

  /* ━━━ Google button — official monochrome aesthetic, editorial scale ━━━ */
  .google-btn {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--hair-strong);
    padding: 16px 28px 15px;
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.1px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow-card);
    display: inline-flex; align-items: center; justify-content: center; gap: 14px;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .google-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 18px rgba(58,47,34,.12);
    border-color: var(--ink-muted);
  }
  .google-btn:active { transform: translateY(0); }
  .google-btn:disabled {
    cursor: wait;
    color: var(--ink-muted);
  }
  .google-btn svg {
    width: 20px; height: 20px;
    flex-shrink: 0;
  }
  .google-btn .label { line-height: 1; }

  /* spinner shown while signing in */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--hair-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .9s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .google-btn.loading .spinner { display: inline-block; }
  .google-btn.loading svg { display: none; }

  .foot {
    margin-top: 28px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-muted);
    font-style: italic;
    text-align: center;
    max-width: 42ch;
    margin-left: auto; margin-right: auto;
  }
  .foot strong {
    color: var(--ink);
    font-style: normal;
    font-weight: 500;
  }
  .foot a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--hair-strong);
    font-style: normal;
    transition: color .18s var(--ease), border-color .18s var(--ease);
  }
  .foot a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ━━━ footer ━━━ */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--hair);
    font-size: 13px;
    color: var(--ink-muted);
    font-style: italic;
  }
  .footer-links { display: flex; gap: 24px; }
  .footer-links a {
    color: var(--ink); text-decoration: none; font-style: normal;
    transition: color .18s var(--ease);
  }
  .footer-links a:hover { color: var(--accent); }
  .footer-cite { font-variant-numeric: oldstyle-nums; }

  @media (max-width: 720px) {
    .page { padding: 20px 24px; }
    .title { font-size: 44px; }
    .masthead { grid-template-columns: 1fr auto; }
    .masthead-right { display: none; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ━━━━━━━━━━━━━━━━ MASTHEAD ━━━━━━━━━━━━━━━━ -->
  <header class="masthead">
    <div class="masthead-left">
      <span>Vol. III <span class="dot">·</span> No. 147</span>
    </div>

    <a href="Landing.html" class="logo">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="logo-text">puddle</span>
    </a>

    <nav class="masthead-right">
      <a href="About.html">About</a>
      <a href="SignIn.html" class="current">Sign in</a>
    </nav>
  </header>
  <div class="rule-thin"></div>

  <!-- ━━━━━━━━━━━━━━━━ MAIN ━━━━━━━━━━━━━━━━ -->
  <main class="main">

    <section class="stage">
      <p class="kicker">A formality</p>
      <h1 class="title">
        Sign in to <em>the</em> <span class="ink-accent">column.</span>
      </h1>

      <button class="google-btn" id="google-btn" type="button" aria-label="Continue with Google">
        <!-- Official Google G mark -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        <span class="spinner" aria-hidden="true"></span>
        <span class="label" id="google-label">Continue with Google</span>
      </button>

      <p class="foot">
        We won't email you unless you ask. The only thing we'll remember is <strong>which puzzles you've solved</strong>. <a href="About.html">More about the column →</a>
      </p>
    </section>

  </main>

  <!-- ━━━━━━━━━━━━━━━━ FOOTER ━━━━━━━━━━━━━━━━ -->
  <footer class="footer">
    <span class="footer-cite">Established 2026.</span>
    <div class="footer-links">
      <a href="About.html">About</a>
      <a href="Submit.html">Submit a puzzle</a>
      <a href="mailto:rohan.karamel@gmail.com">Contact</a>
    </div>
  </footer>

</div>

<script>
(function () {
  // Prototype: simulate the OAuth round-trip with a brief loading state,
  // then land the user on today's puzzle as if they're signed in.
  const btn = document.getElementById('google-btn');
  const label = document.getElementById('google-label');
  btn.addEventListener('click', () => {
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    btn.disabled = true;
    label.textContent = 'Connecting to Google…';
    setTimeout(() => {
      label.textContent = 'Signed in. Loading…';
      setTimeout(() => { window.location.href = 'Puzzle.html'; }, 600);
    }, 1100);
  });
})();
</script>

</body>
</html>
